<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>开机自启</title>
<style>
  :root {
    --card-bg: #ffffff; --border: #e8eaee; --border-soft: #f0f1f4;
    --text: #1a1f28; --muted: #71767f; --faint: #a0a5ad;
    --green: #16a34a; --green-bg: rgba(22,163,74,.09);
    --gray-bg: rgba(113,118,127,.10);
    --accent: #3b82f6; --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  [data-theme="dark"] {
    --card-bg: #2a2e35; --border: #3a3f47; --border-soft: #333840;
    --text: #e9ebee; --muted: #9ba0a9; --faint: #6b7079;
    --green: #4ade80; --green-bg: rgba(74,222,128,.12);
    --gray-bg: rgba(155,160,169,.14);
    --accent: #6aa3f8; --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: transparent; color: var(--text);
    font-size: 13px; padding: 14px;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 18px 14px;
  }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .head .t { font-size: 14px; font-weight: 600; }
  .head .s { font-size: 12px; color: var(--muted); margin-top: 3px; }

  .switch { position: relative; width: 40px; height: 22px; flex: none; }
  .switch input { display: none; }
  .slider { position: absolute; inset: 0; background: var(--gray-bg); border-radius: 11px; transition: .18s; cursor: pointer; }
  .slider::before {
    content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px;
    background: #fff; border-radius: 50%; transition: .18s;
    box-shadow: 0 1px 2px rgba(0,0,0,.28);
  }
  .switch input:checked + .slider { background: var(--green); }
  .switch input:checked + .slider::before { transform: translateX(18px); }

  hr { border: none; height: 1px; background: var(--border-soft); margin: 14px 0; }

  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 500;
    padding: 3px 11px; border-radius: 999px;
    background: var(--green-bg); color: var(--green);
  }
  .badge.off { background: var(--gray-bg); color: var(--muted); }
  .badge .d { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .kv { display: flex; gap: 10px; padding: 5px 0; font-size: 12px; }
  .kv .k { width: 60px; flex: none; color: var(--faint); }
  .kv .v { font-family: var(--mono); font-size: 11.5px; color: var(--muted); word-break: break-all; line-height: 1.55; }

  #mismatch {
    display: none; margin-top: 4px;
    padding: 9px 12px; border-radius: 8px;
    background: rgba(217,119,6,.09); border: 1px solid rgba(217,119,6,.30);
    align-items: center; justify-content: space-between; gap: 10px;
  }
  #mismatch .txt { font-size: 12px; color: #b45309; }
  [data-theme="dark"] #mismatch .txt { color: #fbbf24; }
  button {
    border: none; background: var(--accent); color: #fff;
    border-radius: 6px; padding: 5px 14px; cursor: pointer; font-size: 12px; flex: none;
  }
  button:hover { opacity: .9; }
  button:disabled { opacity: .55; cursor: default; }

  details { margin-top: 2px; }
  summary {
    cursor: pointer; list-style: none; user-select: none;
    font-size: 12px; color: var(--faint); padding: 4px 0;
  }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "高级 "; }
  summary::after { content: " ›"; transition: .15s; }
  details[open] summary::after { transform: rotate(90deg); display: inline-block; }
  summary:hover { color: var(--accent); }
  .adv { padding: 8px 0 2px; border-top: 1px solid var(--border-soft); margin-top: 6px; }
  .adv p { font-size: 11.5px; color: var(--faint); line-height: 1.7; margin-top: 6px; }

  #status { font-size: 11px; color: var(--faint); min-height: 15px; padding: 8px 2px 0; text-align: center; }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div>
        <div class="t">开机自启</div>
        <div class="s">登录 Windows 后自动启动 ZCode</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggle">
        <span class="slider"></span>
      </label>
    </div>

    <hr>

    <span class="badge" id="badge"><span class="d"></span><span id="badgeText">读取中</span></span>

    <div style="margin-top:10px">
      <div class="kv"><span class="k">启动命令</span><span class="v" id="runValue">—</span></div>
    </div>

    <div id="mismatch">
      <span class="txt">与插件设置不一致</span>
      <button id="fixBtn" type="button">应用设置</button>
    </div>

    <hr>

    <details>
      <summary></summary>
      <div class="adv">
        <div class="kv"><span class="k">注册表键</span><span class="v" id="runKey">—</span></div>
        <p>此处开关立即生效；设置页中的同名开关保存后自动应用。修改启动路径：设置 → 插件 → 开机自启 → 配置。</p>
      </div>
    </details>
  </div>
  <div id="status"></div>

<script>
"use strict";

let nextId = 1;
const pending = new Map();
let hostContext = {};

function post(message) { (window.parent || window).postMessage(message, "*"); }

window.addEventListener("message", event => {
  const data = event.data;
  if (!data || data.jsonrpc !== "2.0") return;
  if (data.id !== undefined && data.id !== null) {
    const entry = pending.get(data.id);
    if (!entry) return;
    pending.delete(data.id);
    if (data.error) entry.reject(new Error(data.error.message ?? "未知错误"));
    else entry.resolve(data.result);
  } else if (data.method === "ui/notifications/host-context-changed") {
    hostContext = { ...hostContext, ...(data.params ?? {}) };
    applyTheme();
  }
});

function request(method, params, timeoutMs = 30000) {
  return new Promise((resolve, reject) => {
    const id = nextId++;
    pending.set(id, { resolve, reject });
    post({ jsonrpc: "2.0", id, method, params });
    setTimeout(() => { if (pending.has(id)) { pending.delete(id); reject(new Error(`${method} 超时`)); } }, timeoutMs);
  });
}

async function callTool(name, args) {
  const result = await request("tools/call", { name, arguments: args ?? {} });
  if (result?.isError) throw new Error(result.content?.[0]?.text ?? "操作失败");
  return result?.structuredContent ?? {};
}

const $ = id => document.getElementById(id);

function applyTheme() {
  const theme = hostContext?.theme ?? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.dataset.theme = theme;
}

function render(data) {
  applyTheme();
  const enabled = data.enabled === true;
  const consistent = (data.configEnabled === true) === enabled;

  $("toggle").checked = enabled;
  $("badge").className = "badge" + (enabled ? "" : " off");
  $("badgeText").textContent = enabled ? "已启用" : "已停用";
  $("runValue").textContent = data.runValue ?? "（未设置）";
  $("runKey").textContent = data.runKeyPath ?? "—";
  $("mismatch").style.display = consistent ? "none" : "flex";
}

async function loadStatus(silent) {
  if (!silent) $("status").textContent = "正在读取…";
  try { render(await callTool("get_status")); if (!silent) $("status").textContent = ""; }
  catch (err) { $("status").textContent = `读取失败：${err.message}`; }
}

$("toggle").addEventListener("change", async e => {
  const enabled = e.target.checked;
  $("toggle").disabled = true;
  try { render(await callTool("set_autostart", { enabled })); }
  catch (err) { $("status").textContent = `操作失败：${err.message}`; await loadStatus(true); }
  finally { $("toggle").disabled = false; }
});

$("fixBtn").addEventListener("click", async () => {
  $("fixBtn").disabled = true;
  $("status").textContent = "正在应用…";
  try { render(await callTool("sync_from_config")); $("status").textContent = "已应用"; }
  catch (err) { $("status").textContent = `失败：${err.message}`; }
  finally { $("fixBtn").disabled = false; }
});

async function connect() {
  try {
    const result = await request("ui/initialize", {
      appInfo: { name: "zcode-autostart", version: "0.1.6" },
      appCapabilities: {},
      protocolVersion: "2026-01-26",
    });
    hostContext = { ...(result?.hostContext ?? {}) };
    post({ jsonrpc: "2.0", method: "ui/notifications/initialized" });
  } catch (err) {
    $("status").textContent = `连接失败：${err.message}`;
  }
  applyTheme();
  await loadStatus();
  setInterval(() => loadStatus(true), 8000);
}

connect();
</script>
</body>
</html>
